[project]
name = "toronto-building-permits-map"
version = "0.0.0"
description = "Toronto building permits — the complete active permit register, searchable by address and permit number, with status, type, and year filters."
requires-python = ">=3.11"

# Runtime dependencies. Say why each one is here.
# Stream the City's large municipal address GeoJSON without loading it into RAM.
dependencies = [
    "ijson>=3.3",
    "requests>=2.31", # reliable streamed downloads of the City's official bulk exports
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# This project is an environment, not a distributable package -- nothing to build.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.staticsite]
# Homepage-listing metadata, aggregated into the repo-root sites.json by
# ../generate_manifest.py. `title` is the link text; the blurb shown after it is
# [project].description with the leading "<title> — " stripped, so description
# must start with "<title> — ".
title = "Toronto building permits"
