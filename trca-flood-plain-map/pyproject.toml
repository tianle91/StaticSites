[project]
name = "trca-flood-plain-map"
version = "0.0.0"
description = "TRCA flood plain map — TRCA riverine flood plains and attributed floodline boundaries, filterable by watershed and mapped source."
requires-python = ">=3.11"

# Runtime dependencies. Say why each one is here.
# Shapely supplies topology-preserving simplification of the display snapshot.
dependencies = [
    "shapely>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# This project is an environment, not a distributable package -- nothing to build.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.staticsite]
# Homepage-listing metadata, aggregated into the repo-root sites.json by
# ../generate_manifest.py. `title` is the link text; the blurb shown after it is
# [project].description with the leading "<title> — " stripped, so description
# must start with "<title> — ".
title = "TRCA flood plain map"

[tool.staticsite.refresh]
# Scheduled `make data` is opt-in. Set enabled=true once the real fetch is
# content-aware, then choose its cadence and first UTC run date.
enabled = false
every_days = 7
anchor_date = "2026-01-01"
timeout_minutes = 30
