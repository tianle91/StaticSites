[project]
name = "canada-mortgage-stress"
version = "0.0.0"
description = "Ontario Mortgage Stress — Ontario bank mortgage arrears and Toronto-area house prices in one plot, with a shared timeline and simple date and series controls."
requires-python = ">=3.11"

# Runtime dependencies. Say why each one is here.
dependencies = [
    "beautifulsoup4>=4.15.0", # Parse CMHC's accessible chart tables.
    "pypdf>=6.21.4", # Extract TRREB's public historical price tables.
    "requests>=2.34.2", # HTTP timeouts and required-source failures.
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# This project is an environment, not a distributable package -- nothing to build.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.staticsite]
# Homepage-listing metadata, aggregated into the repo-root sites.json by
# ../generate_manifest.py. `title` is the link text; the blurb shown after it is
# [project].description with the leading "<title> — " stripped, so description
# must start with "<title> — ".
title = "Ontario Mortgage Stress"
